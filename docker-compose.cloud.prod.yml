# docker compose -f docker-compose.cloud.prod.yml up
services:
  app:
    image: ghcr.io/chen-ye/where2go:latest
    ports:
      - "8070:8070"
      - "5174:5174"
    environment:
      PGHOST: ${PGHOST}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
      PGPORT: ${PGPORT:-5432}
      PGSSLMODE: prefer
      VITE_API_URL: http://localhost:8070
      NODE_ENV: production
      VALHALLA_ENDPOINT: ${VALHALLA_ENDPOINT:-}
    volumes:
      - ./config:/app/frontend/config
    command: >
      sh -c "
      if [ ! -d /app/frontend/config/layers ]; then
        echo 'Config directory empty or missing layers. Populating with defaults...' &&
        mkdir -p /app/frontend/config &&
        cp -R /app/frontend/config.default/* /app/frontend/config/
      fi &&
      yarn run build &&
      yarn run start
      "

  db-pinger:
    image: ghcr.io/chen-ye/where2go:latest
    environment:
      PGHOST: ${PGHOST}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
      PGPORT: ${PGPORT:-5432}
      PGSSLMODE: ${PGSSLMODE:-prefer}
      DATABASE_URL: ${DATABASE_URL:-}
      NODE_ENV: production
      DB_PING_INTERVAL_MINUTES: ${DB_PING_INTERVAL_MINUTES:-60}
    command: node backend/jobs/db-pinger.ts
    restart: unless-stopped

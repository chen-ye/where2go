services:
  app:
    image: ghcr.io/chen-ye/where2go:latest
    ports:
      - "8070:8070"
      - "5174:5174"
    environment:
      PGHOST: ${PGHOST:-db}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
      PGPORT: ${PGPORT:-5432}
      PGSSLMODE: prefer
      VITE_API_URL: http://localhost:8070
      NODE_ENV: production
    depends_on:
      - db

  db:
    extends:
      file: docker-compose.base.yml
      service: db

volumes:
  db-data:

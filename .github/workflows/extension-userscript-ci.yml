name: Extension & Userscript CI

on:
  push:
    branches: [main]
    paths:
      - 'extension/**'
      - 'userscript/**'
      - '.github/workflows/extension-userscript-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'extension/**'
      - 'userscript/**'
      - '.github/workflows/extension-userscript-ci.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-extension:
    name: Check Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run Extension Check
        run: yarn workspace where2go-extension check

  check-userscript:
    name: Check Userscript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run Userscript Check
        run: yarn workspace where2go-userscript check
